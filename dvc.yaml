stages:
  prepare:
    cmd: python -m src.data.make_dataset
    deps:
      - src/data/make_dataset.py
      - src/config.py
      - data/raw/default of credit card clients.xls
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  validate:
    cmd: python -m src.data.validation
    deps:
      - src/data/validation.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - data/expectations/credit_data_suite.json:
          cache: false

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - src/models/pipeline.py
      - src/models/metrics.py
      - src/features/build_features.py
      - data/processed/train.csv
      - data/processed/test.csv
      - data/expectations/credit_data_suite.json
    outs:
      - models/model.pkl:
          cache: false
      - reports/experiments.csv:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
